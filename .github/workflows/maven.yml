name: Maven build

on:
  push:
  release:
    types:
      - published
  workflow_dispatch:
        
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21, 25 ]
    name: Java ${{ matrix.java }} build

    steps:
    - uses: actions/checkout@v7

#    - name: Prepare version labels
#      uses: k15g/action-version-labels@edge
#      with:
#        prefix: project

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD

    - name: Cache local Maven repository
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Publish to the Maven Central Repository
      run: mvn --batch-mode --update-snapshots -P release-snapshot deploy
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.java == 17
      env:
        MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

    - name: Maven Build
      run: mvn --batch-mode --update-snapshots install
      if: github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || matrix.java != 17

    - name: Docker login
      uses: docker/login-action@v4
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.java == 17
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build Docker image
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.java == 17
      run: make docker_build tag=dev

    - name: Push Snapshot images
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.java == 17
      run: make docker_push tag=edge

    - name: Push Release images
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.java == 17
      run: |
        make docker_push tag=latest
#        make docker_push tag=${{ env.PROJECT_VERSION }}
